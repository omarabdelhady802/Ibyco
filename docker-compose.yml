version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibyco_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/instance/Ibyco.db
      - REDIS_HOST=redis
    volumes:
      - ./instance:/app/instance  # ✅ local folder mounted
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibyco_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibyco_worker
    restart: unless-stopped
    command: python -m service.redis_worker
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDIS_HOST=redis
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/instance/Ibyco.db  # ✅ ADDED
    volumes:
      - ./instance:/app/instance  # ✅ ADDED - same folder as app!
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibyco_network

  redis:
    image: redis:7-alpine
    container_name: ibyco_redis
    restart: unless-stopped
    command: redis-server --notify-keyspace-events KEx --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ibyco_network

volumes:
  redis_data:  # ✅ removed unused sqlite_data

networks:
  ibyco_network:
    driver: bridge