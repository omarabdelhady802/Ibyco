{% extends 'base.html' %}

{% block content %}

<h1 class="mt-4">تعديل الصفحة</h1>

<form method="post" action="{{ url_for('edit_page', page_id=page.id) }}">

<div class="form-group">
<label for="page_id">Page ID:</label>
<input type="text" class="form-control" id="page_id" name="page_id" value="{{ page.page_id }}" required>
</div>

<div class="form-group">
<label for="page_token">Page Token:</label>
<textarea class="form-control" id="page_token" name="page_token" required>{{ page.page_token }}</textarea>
</div>

<div class="form-group">
<label for="phone_id">Phone ID:</label>
<input type="text" class="form-control" id="phone_id" name="phone_id" value="{{ page.phone_id }}">
</div>

<div class="form-group">
<label for="platform_id">Platform:</label>
<select class="form-control" id="platform_id" name="platform_id">

<option value="1" {% if page.platform_id == 1 %}selected{% endif %}>
WhatsApp
</option>

<option value="2" {% if page.platform_id == 2 %}selected{% endif %}>
Messenger
</option>

</select>
</div>

<div class="form-group mt-2">
<label>
<input type="checkbox" name="is_active" {% if page.is_active %}checked{% endif %}>
مفعل
</label>
</div>

<button type="submit" class="btn btn-success mt-3">حفظ</button>

</form>

{% endblock %}
